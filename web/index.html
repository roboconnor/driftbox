<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driftbox</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Driftbox</h1>

    <section id="status">
      <h2>Status</h2>
      <pre id="status-output">Loading…</pre>
      <button id="refresh">Refresh</button>
      <button id="restart">Restart playback</button>
    </section>

    <section>
      <h2>Configuration</h2>
      <form id="config-form">
        <label>
          Soundscape
          <input name="soundscape" type="text" required>
        </label>

        <label>
          Mode
          <select name="mode">
            <option value="single_loop">Single looping file</option>
            <option value="layers">Generative layers</option>
          </select>
        </label>

        <fieldset>
          <legend>Single loop</legend>
          <label>
            MP3 file
            <input name="single_loop_file" type="text">
          </label>
          <label>
            Gain
            <input name="single_loop_gain" type="number" min="0" max="1" step="0.05">
          </label>
        </fieldset>

        <fieldset>
          <legend>Layers</legend>
          <label>
            Layer folder
            <input name="layer_folder" type="text">
          </label>
          <label>
            Minimum gap (seconds)
            <input name="layer_min_gap" type="number" min="0" step="0.5">
          </label>
          <label>
            Maximum gap (seconds)
            <input name="layer_max_gap" type="number" min="0" step="0.5">
          </label>
          <label>
            Gain
            <input name="layer_gain" type="number" min="0" max="1" step="0.05">
          </label>
        </fieldset>

        <button type="submit">Save and apply</button>
      </form>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
