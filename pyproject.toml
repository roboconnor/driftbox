[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftbox"
version = "0.1.0"
description = "Offline-first sample-based soundscape player"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
  "pydantic>=2.7"
]

[project.scripts]
driftbox = "driftbox.main:run"

[tool.setuptools]
packages = ["driftbox"]